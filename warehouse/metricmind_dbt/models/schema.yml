version: 2

models:
  - name: stg_superstore
    description: "Cleaned and standardized staging model for the Global Superstore dataset."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - not_null

      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null

      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null

      - name: region
        description: "Region where the order was placed."
        tests:
          - not_null

      - name: sales
        description: "Sales amount for the order."
        tests:
          - not_null

      - name: profit
        description: "Profit earned from the order."

  - name: dim_customer
    description: "Dimension table containing customer information."

    columns:
      - name: customer_id
        tests:
          - not_null

  - name: dim_product
    description: "Dimension table containing product details."

    columns:
      - name: product_id
        tests:
          - not_null

  - name: dim_region
    description: "Dimension table containing regional information."

    columns:
      - name: region
        tests:
          - not_null

  - name: fact_sales
    description: "Fact table storing sales transactions for business analytics."

    columns:
      - name: order_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id

      - name: region
        tests:
          - relationships:
              to: ref('dim_region')
              field: region