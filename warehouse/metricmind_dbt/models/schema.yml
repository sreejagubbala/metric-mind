version: 2

models:
  - name: stg_superstore
    description: "Clean staging model for Superstore dataset."

    columns:
      - name: row_id
        description: "Unique row identifier."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Order identifier."
        tests:
          - not_null

      - name: customer_id
        description: "Customer identifier."
        tests:
          - not_null

      - name: product_id
        description: "Product identifier."
        tests:
          - not_null

      - name: sales
        description: "Sales amount."
        tests:
          - not_null

      - name: region
        description: "Sales region."
        tests:
          - accepted_values:
              arguments:
                values: ['Central', 'East', 'South', 'West']

  - name: fact_sales
    description: "Fact table containing sales transactions."

    columns:
      - name: row_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: sales
        tests:
          - not_null

      - name: profit
        tests:
          - not_null

  - name: dim_customer
    description: "Customer dimension."

  - name: dim_product
    description: "Product dimension."

  - name: dim_region
    description: "Region dimension."

    columns:
    - name: region
      description: "Region name."

      tests:
        - not_null

  - name: monthly_sales
    description: "Monthly sales and profit summary."

  - name: regional_sales
    description: "Sales and profit summary by region."

  - name: category_sales
    description: "Sales performance by product category."

  - name: top_products
    description: "Top 10 products based on total sales."

  - name: top_customers
    description: "Top 10 customers based on total sales."

  - name: sales_trend
    description: "Monthly sales trend analysis."

  - name: customer_segment_analysis
    description: "Sales analysis by customer segment."